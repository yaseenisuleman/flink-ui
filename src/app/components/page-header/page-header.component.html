<div class="tb-page-header">
  <div>
    <div class="tb-pretitle">
      <ng-content select="[pretitle]"></ng-content>
      <span *ngIf="live" class="status-dot is-ok status-dot-animated"></span>
      {{ pretitle }}
    </div>
    <h2 class="tb-page-title">
      {{ title }}
      <ng-content select="[title]"></ng-content>
    </h2>
  </div>
  <div class="tb-page-actions">
    <ng-content></ng-content>
  </div>
</div>
