<div class="app-search">
  <i class="bi bi-search"></i>
  <input
    #input
    type="search"
    placeholder="Search pages"
    autocomplete="off"
    aria-label="Search dashboard pages"
    (focus)="open()"
    (input)="onInput(input.value)"
    (keydown)="onKeydown($event)"
  />
  <kbd>Ctrl K</kbd>
  <div class="app-search-results" *ngIf="isOpen">
    <ng-container *ngIf="matches.length; else empty">
      <a
        *ngFor="let item of matches; let i = index; trackBy: trackByLink"
        class="app-search-item"
        [class.active]="i === selected"
        [routerLink]="item.link"
        (mouseenter)="selected = i"
        (click)="done()"
      >
        <i class="bi" [ngClass]="item.icon"></i>
        <span>{{ item.label }}</span>
        <small>{{ item.section }}</small>
      </a>
    </ng-container>
    <ng-template #empty>
      <div class="app-search-empty">No pages match "{{ query }}"</div>
    </ng-template>
  </div>
</div>
