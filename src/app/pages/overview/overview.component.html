<flink-page-header pretitle="Cluster" title="Overview" [live]="true">
  <a
    *ngIf="webSubmitEnabled && !historyServerEnv"
    nz-button
    nzType="primary"
    [routerLink]="['/submit']"
  >
    <i class="bi bi-upload"></i>
    Submit New Job
  </a>
</flink-page-header>
<flink-overview-statistic [statisticData$]="statisticData$"></flink-overview-statistic>
<flink-overview-trends></flink-overview-trends>
<flink-application-list
  [applicationData$]="applicationData$"
  [title]="'Running Applications'"
  [completed]="false"
  (navigate)="navigateToApplication(['application', 'running', $event.id])"
></flink-application-list>
<flink-application-list
  [applicationData$]="applicationData$"
  [title]="'Completed Applications'"
  [completed]="true"
  (navigate)="navigateToApplication(['application', 'completed', $event.id])"
></flink-application-list>
